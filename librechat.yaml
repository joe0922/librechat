version: 1.3.13
cache: true

modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "claude-sonnet-5"
      label: "Claude Sonnet 5"
      default: true
      preset:
        endpoint: "anthropic"
        model: "claude-sonnet-5"

fileConfig:
  endpoints:
    default:
      fileLimit: 9999
      fileSizeLimit: 100
      totalSizeLimit: 200
    anthropic:
      fileLimit: 9999
      fileSizeLimit: 100
      totalSizeLimit: 200
  fileTokenLimit: 200000
